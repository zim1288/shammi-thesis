<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clinical Telemetry — OTP Verification</title>
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  
  <!-- Dedicated OTP Verification CSS (from d:\code design\OTP Verification) -->
  <link rel="stylesheet" href="assets/css/otp.css">

  <!-- EmailJS SDK Integration (Loaded dynamically via Render Environment Variables) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    window.EMAILJS_CONFIG = window.EMAILJS_CONFIG || {};
    fetch('../api/auth/config.php')
      .then(res => res.json())
      .then(json => {
        if (json.success && json.data?.emailjs) {
          window.EMAILJS_CONFIG = json.data.emailjs;
          if (window.emailjs && window.EMAILJS_CONFIG.publicKey) {
            emailjs.init(window.EMAILJS_CONFIG.publicKey);
          }
        }
      })
      .catch(err => console.warn('Could not load dynamic EmailJS config:', err));
  </script>
</head>
<body>

  <!-- Ambient Cursor Glow & Noise -->
  <div class="pointer-light" id="pointerLight"></div>
  <div class="noise"></div>

  <!-- Top Navigation & Prototype Notice -->
  <header class="top-nav-bar">
    <a href="auth.html" class="back-pill">
      <i class="ri-arrow-left-line"></i>
      <span>Back to Authentication</span>
    </a>
    <div class="prototype-tag" style="font-size:12px; padding:6px 14px; border-radius:999px; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.25); color:#fca5a5;">
      ⚠️ Educational Prototype — Not for Diagnosis
    </div>
  </header>

  <!-- =========================================================================
       MAIN OTP VERIFICATION VAULT CARD
       ========================================================================= -->
  <main class="card" id="card">
    <h1 id="title">Enter Access Code</h1>
    <p class="subtitle" id="subtitle">A 4-digit verification code has been dispatched to your email.</p>

    <div class="stage" id="stage">
      <!-- 4-Digit Input Stage -->
      <div class="input-stage" id="inputStage">
        <input type="text" class="input-pill" maxlength="1" inputmode="numeric" aria-label="Digit 1" data-index="0" autofocus>
        <input type="text" class="input-pill" maxlength="1" inputmode="numeric" aria-label="Digit 2" data-index="1">
        <input type="text" class="input-pill" maxlength="1" inputmode="numeric" aria-label="Digit 3" data-index="2">
        <input type="text" class="input-pill" maxlength="1" inputmode="numeric" aria-label="Digit 4" data-index="3">
      </div>

      <!-- Orbit Physics Ring Layer -->
      <div class="orbit-layer" id="orbitLayer">
        <div class="orbit-ring" id="orbitRing"></div>
      </div>

      <!-- Loading Counter (0-100%) -->
      <div class="loading-wrap" id="loadingWrap">
        <div class="loading-core">
          <div class="loading-ring"></div>
          <div class="loading-pulse"></div>
          <div class="loading-inner" id="loadingPercent">0</div>
        </div>
      </div>

      <!-- Success Vault & Confetti Burst Layer -->
      <div class="success-wrap" id="successWrap">
        <div class="success-flash"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="success-vault">
          <svg class="checkmark" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="success-badge">Verified</div>
      </div>
    </div>

    <!-- Error Prompt -->
    <div class="error-msg" id="errorMsg">Incorrect code. Please try again.</div>

    <!-- New Password Reset Stage (Revealed after OTP verification for forgot_password) -->
    <div class="reset-stage" id="resetStage" style="display:none;">
      <form id="resetPasswordForm" autocomplete="off" novalidate>
        <div class="reset-field">
          <label for="newPassword" class="reset-label">New Password</label>
          <div class="reset-input-wrapper">
            <i class="ri-lock-2-line reset-icon-left"></i>
            <input type="password" id="newPassword" class="reset-input" placeholder="Enter new password (min. 6 chars)" required>
            <button type="button" class="reset-eye-btn" id="toggleEyeNew" aria-label="Toggle password visibility">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>

        <!-- Password Requirements Live Indicator -->
        <div class="reset-requirements" id="resetRequirements">
          <div class="req-item" id="reqChars"><i class="ri-circle-line"></i> <span>At least 6 characters</span></div>
          <div class="req-item" id="reqNum"><i class="ri-circle-line"></i> <span>Contains a number (0-9)</span></div>
          <div class="req-item" id="reqCase"><i class="ri-circle-line"></i> <span>Uppercase & lowercase letters</span></div>
        </div>

        <div class="reset-field">
          <label for="confirmPassword" class="reset-label">Confirm New Password</label>
          <div class="reset-input-wrapper">
            <i class="ri-lock-password-line reset-icon-left"></i>
            <input type="password" id="confirmPassword" class="reset-input" placeholder="Re-type new password" required>
            <button type="button" class="reset-eye-btn" id="toggleEyeConfirm" aria-label="Toggle confirm password visibility">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>

        <div class="reset-error-msg" id="resetErrorMsg"></div>

        <button type="submit" class="reset-submit-btn" id="btnSubmitResetPassword">
          <span>Update Password</span>
          <i class="ri-arrow-right-line"></i>
        </button>
      </form>
    </div>

    <!-- Resend Button -->
    <button class="resend-btn" id="resendBtn">Didn't receive it? <span>Resend</span></button>
  </main>

  <!-- OTP Controller Script -->
  <script src="assets/js/otp.js"></script>
</body>
</html>

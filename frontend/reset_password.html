<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clinical Telemetry — Set New Password</title>
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  
  <!-- Shared Glassmorphic Styling -->
  <link rel="stylesheet" href="assets/css/otp.css">
</head>
<body>

  <!-- Ambient Cursor Glow & Noise -->
  <div class="pointer-light" id="pointerLight"></div>
  <div class="noise"></div>

  <!-- Top Navigation & Prototype Notice -->
  <header class="top-nav-bar">
    <a href="auth.html" class="back-pill">
      <i class="ri-arrow-left-line"></i>
      <span>Back to Login</span>
    </a>
    <div class="prototype-tag" style="font-size:12px; padding:6px 14px; border-radius:999px; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.25); color:#fca5a5;">
      ⚠️ Educational Prototype — Not for Diagnosis
    </div>
  </header>

  <!-- =========================================================================
       MAIN RESET PASSWORD VAULT CARD
       ========================================================================= -->
  <main class="card" id="card" style="max-width: 440px;">
    <!-- Icon Badge -->
    <div style="width: 52px; height: 52px; margin: 0 auto 16px auto; border-radius: 14px; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); display: flex; align-items: center; justify-content: center; color: #818cf8; font-size: 24px;">
      <i class="ri-lock-password-line"></i>
    </div>

    <h1 id="title" style="font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 6px;">Set New Password</h1>
    <p class="subtitle" id="subtitle" style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 22px;">
      Create and confirm your new secure clinician password.
    </p>

    <!-- Reset Form -->
    <form id="resetPasswordForm" autocomplete="off" novalidate style="width: 100%; text-align: left;">
      
      <!-- New Password Field -->
      <div class="reset-field" style="margin-bottom: 14px;">
        <label for="newPassword" class="reset-label" style="display:block; font-size:12px; font-weight:500; color:#a1a1aa; margin-bottom:6px;">New Password</label>
        <div class="reset-input-wrapper" style="position:relative; display:flex; align-items:center;">
          <i class="ri-lock-2-line reset-icon-left" style="position:absolute; left:14px; color:#a1a1aa; font-size:17px; pointer-events:none;"></i>
          <input type="password" id="newPassword" class="reset-input" placeholder="Enter new password (min. 6 chars)" required autofocus
                 style="width:100%; padding:12px 42px 12px 40px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:14px; color:#f4f4f5; font-size:14px; outline:none;">
          <button type="button" class="reset-eye-btn" id="toggleEyeNew" aria-label="Toggle password visibility"
                  style="position:absolute; right:12px; background:transparent; border:none; color:#a1a1aa; font-size:18px; cursor:pointer; padding:4px;">
            <i class="ri-eye-line"></i>
          </button>
        </div>
      </div>

      <!-- Password Requirements Live Indicator -->
      <div class="reset-requirements" id="resetRequirements" style="display:flex; flex-direction:column; gap:6px; margin: -4px 0 16px 4px; font-size:11px;">
        <div class="req-item" id="reqChars" style="display:flex; align-items:center; gap:6px; color:#a1a1aa;"><i class="ri-circle-line"></i> <span>At least 6 characters</span></div>
        <div class="req-item" id="reqNum" style="display:flex; align-items:center; gap:6px; color:#a1a1aa;"><i class="ri-circle-line"></i> <span>Contains a number (0-9)</span></div>
        <div class="req-item" id="reqCase" style="display:flex; align-items:center; gap:6px; color:#a1a1aa;"><i class="ri-circle-line"></i> <span>Uppercase & lowercase letters</span></div>
      </div>

      <!-- Confirm Password Field -->
      <div class="reset-field" style="margin-bottom: 16px;">
        <label for="confirmPassword" class="reset-label" style="display:block; font-size:12px; font-weight:500; color:#a1a1aa; margin-bottom:6px;">Confirm New Password</label>
        <div class="reset-input-wrapper" style="position:relative; display:flex; align-items:center;">
          <i class="ri-lock-password-line reset-icon-left" style="position:absolute; left:14px; color:#a1a1aa; font-size:17px; pointer-events:none;"></i>
          <input type="password" id="confirmPassword" class="reset-input" placeholder="Re-type new password" required
                 style="width:100%; padding:12px 42px 12px 40px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:14px; color:#f4f4f5; font-size:14px; outline:none;">
          <button type="button" class="reset-eye-btn" id="toggleEyeConfirm" aria-label="Toggle confirm password visibility"
                  style="position:absolute; right:12px; background:transparent; border:none; color:#a1a1aa; font-size:18px; cursor:pointer; padding:4px;">
            <i class="ri-eye-line"></i>
          </button>
        </div>
      </div>

      <!-- Error Message Box -->
      <div class="reset-error-msg" id="resetErrorMsg" style="display:none; color:#f43f5e; font-size:12px; margin-bottom:14px; text-align:center; background:rgba(244,63,94,0.12); border:1px solid rgba(244,63,94,0.25); padding:9px 12px; border-radius:10px;"></div>

      <!-- Submit Button -->
      <button type="submit" class="reset-submit-btn" id="btnSubmitResetPassword"
              style="width:100%; padding:13px 18px; background:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%); border:none; border-radius:14px; color:#ffffff; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; box-shadow:0 4px 16px rgba(99,102,241,0.35);">
        <span>Update Password</span>
        <i class="ri-arrow-right-line"></i>
      </button>

      <!-- Back to login alternative -->
      <div style="text-align:center; margin-top:16px;">
        <a href="auth.html" style="color:#a1a1aa; font-size:12px; text-decoration:none; transition:color 0.2s;">
          Cancel & Return to <span style="color:#818cf8; font-weight:600;">Login</span>
        </a>
      </div>
    </form>
  </main>

  <script src="assets/js/reset_password.js"></script>
</body>
</html>

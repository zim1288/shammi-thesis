<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clinical Telemetry — Set New Password</title>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- Production Authentication Theme Styling -->
  <link rel="stylesheet" href="assets/css/auth.css">

  <style>
    /* Dedicated Set Credentials Card Layout */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
      background: #080b12;
      position: relative;
    }

    .set-credentials-card {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg, #111827);
      border: 1px solid var(--card-border, rgba(255, 255, 255, 0.08));
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(99, 102, 241, 0.15);
      z-index: 10;
      animation: cardFadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardFadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-badge-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px auto;
      border-radius: 14px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818cf8;
      font-size: 24px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-box {
      margin-bottom: 14px;
    }

    .return-link-wrap {
      text-align: center;
      margin-top: 18px;
    }

    .return-link {
      color: #94a3b8;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .return-link span {
      color: #818cf8;
      font-weight: 600;
    }

    .return-link:hover span {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Ambient Cursor Glow & Noise -->
  <div class="pointer-light" id="pointerLight"></div>
  <div class="noise"></div>

  <!-- Top Navigation & Prototype Notice -->
  <header class="top-nav-bar" style="position: fixed; top: 0; left: 0; right: 0; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 100; pointer-events: none;">
    <a href="auth.html" class="back-pill" style="pointer-events: auto;">
      <i class="ri-arrow-left-line"></i>
      <span>Back to Login</span>
    </a>
    <div class="prototype-tag" style="font-size:12px; padding:6px 14px; border-radius:999px; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.25); color:#fca5a5;">
      ⚠️ Educational Prototype — Not for Diagnosis
    </div>
  </header>

  <!-- =========================================================================
       MAIN SET CREDENTIALS CARD (Matches Registration Aesthetic)
       ========================================================================= -->
  <main class="set-credentials-card">
    
    <div class="card-badge-icon">
      <i class="ri-lock-password-line"></i>
    </div>

    <h1 class="card-title">Set New Password</h1>
    <p class="card-subtitle" id="cardSubtitle">
      Enter and reconfirm your new clinical access credentials.
    </p>

    <form id="setCredentialsForm" autocomplete="off" novalidate>
      
      <!-- BOX 1: Enter New Password (with Show/Hide Toggle) -->
      <label for="newPassword" class="field-label">Enter New Password</label>
      <div class="input-box">
        <input type="password" id="newPassword" placeholder="Create Strong Password" required autofocus autocomplete="new-password">
        <button type="button" class="eye-toggle-btn" id="toggleEyeNew" aria-label="Toggle password visibility">
          <i class="ri-eye-line"></i>
        </button>
      </div>

      <!-- BOX 2: Reconfirm the Password (Always Hidden - No Toggle Button) -->
      <label for="confirmPassword" class="field-label">Reconfirm the Password</label>
      <div class="input-box" style="margin-bottom: 8px;">
        <input type="password" id="confirmPassword" placeholder="Reconfirm Password (must match)" required autocomplete="new-password">
        <i class="ri-lock-fill input-icon" title="Hidden to verify password memory"></i>
      </div>

      <!-- Live Match Feedback -->
      <div id="matchIndicator" style="display:none; font-size: 11px; margin-bottom: 12px; padding: 2px 4px;"></div>

      <!-- EMBEDDED STRONG PASSWORD LIVE METER & REQUIREMENTS (Active & Visible like Registration) -->
      <div class="password-strength-container active" id="passwordStrengthContainer" style="display:block; opacity:1; transform:none; margin-top: 8px;">
        <div class="status-top">
          <div class="status-label-group">
            <span>Strength:</span>
            <strong id="pStatus" style="color: #ef4444;">Weak</strong>
          </div>
          <div class="status-icon" id="strengthIcon">
            <i class="ri-shield-line"></i>
          </div>
        </div>

        <div class="strength-bar-track">
          <div class="range-status" id="rangeStatus"></div>
        </div>

        <div class="requirements-title">
          <span>Requirements</span>
          <i class="ri-information-line"></i>
        </div>

        <div class="requirements-list">
          <div class="requirement" id="chars">
            <span class="check"><i class="ri-check-line"></i></span>
            <span>8+ Characters</span>
          </div>
          <div class="requirement" id="AtoZ">
            <span class="check"><i class="ri-check-line"></i></span>
            <span>Uppercase (A-Z)</span>
          </div>
          <div class="requirement" id="atoz">
            <span class="check"><i class="ri-check-line"></i></span>
            <span>Lowercase (a-z)</span>
          </div>
          <div class="requirement" id="num">
            <span class="check"><i class="ri-check-line"></i></span>
            <span>Number (0-9)</span>
          </div>
          <div class="requirement" id="speChar">
            <span class="check"><i class="ri-check-line"></i></span>
            <span>Symbol (@#$)</span>
          </div>
        </div>
      </div>

      <!-- Error Message Box -->
      <div id="resetErrorMsg" style="display:none; color: #f87171; font-size: 12px; margin-bottom: 12px; text-align: center; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); padding: 8px 12px; border-radius: 8px;"></div>

      <!-- Confirm Password Button -->
      <button type="submit" class="submit-btn" id="btnSubmitReset">
        <span>Confirm Password</span>
        <i class="ri-arrow-right-line"></i>
      </button>

      <!-- Cancel & Return to Login -->
      <div class="return-link-wrap">
        <a href="auth.html" class="return-link">
          Cancel & Return to <span>Login</span>
        </a>
      </div>

    </form>
  </main>

  <!-- Dedicated Controller Script (Cache-busted) -->
  <script src="assets/js/set_credentials.js?v=20261112_05"></script>
</body>
</html>
